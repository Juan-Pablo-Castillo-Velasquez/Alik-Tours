# BD de PRUEBAS (Bootcamp Testing ADSO, semana 6). Nunca la de desarrollo:
# - mismo motor y versión que desarrollo y producción (PostgreSQL 16)
# - otro puerto (5433) y otra BD (alektours_test)
# - datos en tmpfs (RAM): "down -v" la deja vacía y arranca rápido
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   docker compose -f docker-compose.test.yml down -v
services:
  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_DB: alektours_test
      POSTGRES_USER: alektours
      POSTGRES_PASSWORD: alektours
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alektours -d alektours_test"]
      interval: 2s
      timeout: 3s
      retries: 20
