# Bootcamp Testing ADSO (semana 2): corre los tests de frontend y backend
# en cada push y en cada PR, y exige el umbral de cobertura de cada parte
# (vite.config.ts y backend/pyproject.toml). Si un umbral no se cumple, el
# job queda en rojo y la regla de rama bloquea el merge.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alecktourfrondend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: alecktourfrondend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Caché del almacén de pnpm (semana 8): la clave sale del lockfile
          cache: pnpm
          cache-dependency-path: alecktourfrondend/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      # "pnpm test" = vitest run --coverage: falla si la cobertura baja del umbral
      - run: pnpm test
      # El reporte HTML de cobertura queda descargable aunque el umbral falle
      # (es justo cuando más se necesita): Actions → el run → Artifacts.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: alecktourfrondend/coverage/
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Sin servicio de Redis: desde la semana 4 los tests usan un Redis en
    # memoria (backend/tests/fakes.py) y nunca uno real.
    env:
      # Solo para que la app importe: ningún test unitario se conecta a esta BD.
      DATABASE_URL: postgresql+psycopg2://admin:admin123@localhost:5432/alektours_db
      SECRET_KEY: ci-test-secret-key-solo-para-ci-no-usar-en-produccion-32chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MAIL_USERNAME: test@test.com
      MAIL_PASSWORD: test
      MAIL_FROM: noreply@alectours.com
      MAIL_PORT: 1025
      MAIL_SERVER: localhost
      MAIL_FROM_NAME: AlecTours
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Caché de pip (semana 8): la segunda corrida no vuelve a descargar todo
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: cp .env.example .env
      - run: pip install -r requirements-dev.txt
      # "pytest" ya mide la cobertura (addopts) y falla bajo fail_under.
      # -rs muestra por qué se salta cada test: aquí se saltan SOLO los de
      # tests/integration (no hay TEST_DATABASE_URL); esos corren en el job
      # "integracion".
      - run: pytest -rs --cov-report=html --cov-report=xml
      # El reporte de cobertura queda descargable (Actions → el run → Artifacts)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: |
            backend/htmlcov/
            backend/coverage.xml
          retention-days: 7

  # Semana 8: la integración contra PostgreSQL REAL, con la BD como servicio
  # del job (mismo motor y versión que desarrollo y producción: 16). Las
  # migraciones crean el esquema antes de los tests, igual que en un
  # despliegue.
  integracion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alektours
          POSTGRES_PASSWORD: alektours
          POSTGRES_DB: alektours_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U alektours -d alektours_test"
          --health-interval 2s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://alektours:alektours@localhost:5433/alektours_test
      TEST_DATABASE_URL: postgresql+psycopg2://alektours:alektours@localhost:5433/alektours_test
      SECRET_KEY: ci-test-secret-key-solo-para-ci-no-usar-en-produccion-32chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MAIL_FROM: noreply@alectours.com
      MAIL_PORT: 1025
      MAIL_SERVER: localhost
      MAIL_FROM_NAME: AlecTours
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: cp .env.example .env
      - run: pip install -r requirements-dev.txt
      - name: Migraciones (esquema real)
        run: alembic upgrade head
      # --no-cov: la cobertura la exige el job "backend"; aquí importa que
      # TODOS los tests de integración corran. Si alguno se salta, el job
      # falla: un CI con tests saltados en silencio miente.
      - name: Tests de integración (cero saltados)
        shell: bash
        run: |
          set -o pipefail
          pytest tests/integration -rs --no-cov | tee salida.txt
          if grep -qE "[0-9]+ skipped" salida.txt; then
            echo "::error::Hay tests de integración saltados: revisa TEST_DATABASE_URL"
            exit 1
          fi

  # Semana 8: los E2E de Playwright en el CI. Backend real (en segundo
  # plano) contra la BD de pruebas, Mailpit para leer el código de
  # verificación del correo y Redis como en producción. Playwright levanta
  # el frontend con Vite (e2e/playwright.config.js).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alektours
          POSTGRES_PASSWORD: alektours
          POSTGRES_DB: alektours_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U alektours -d alektours_test"
          --health-interval 2s
          --health-retries 15
      mailpit:
        image: axllent/mailpit
        ports:
          - "1025:1025"
          - "8025:8025"
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
    env:
      DATABASE_URL: postgresql+psycopg2://alektours:alektours@localhost:5433/alektours_test
      SECRET_KEY: ci-test-secret-key-solo-para-ci-no-usar-en-produccion-32chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REDIS_URL: redis://localhost:6379/0
      # Mailpit no pide usuario ni clave: sin MAIL_USERNAME no se intenta login SMTP
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: noreply@alectours.com
      MAIL_PORT: 1025
      MAIL_SERVER: localhost
      MAIL_FROM_NAME: AlecTours
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Backend en segundo plano (sigue vivo en los pasos siguientes)
        working-directory: backend
        run: |
          cp .env.example .env
          pip install -r requirements.txt
          alembic upgrade head
          uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            alecktourfrondend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      # Playwright levanta el frontend con Vite: necesita sus dependencias
      - run: pnpm install --no-frozen-lockfile
        working-directory: alecktourfrondend
      - run: pnpm install --no-frozen-lockfile
        working-directory: e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      # Espera a que el API responda (máximo 60 s), sin pausas fijas
      - name: Esperar al API
        run: curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8000/health
      - run: pnpm test
        working-directory: e2e
      # Si algo falla, el reporte HTML (con trazas) y el log del backend quedan descargables
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            backend/api.log
          retention-days: 7

  # No construye ni prueba nada: deja en el resumen del run (Actions → el
  # run → arriba) quién hizo commits de test esta semana. Es la evidencia
  # individual que revisa el instructor.
  evidencia-individual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Commits de test por autor esta semana
        run: |
          echo "### Commits de test por autor desde el lunes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git shortlog -sn --since="last Monday" HEAD -- '*tests/*' '*.test.*' 'e2e/*' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
