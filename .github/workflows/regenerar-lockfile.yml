# TEMPORAL: regenera alecktourfrondend/pnpm-lock.yaml con Node 22 y lo deja
# como artefacto (el lockfile quedó desactualizado al agregar las
# dependencias de pruebas y Vercel instala con --frozen-lockfile, así que
# cada despliegue fallaba). Se borra cuando el lockfile nuevo esté en main.
name: regenerar-lockfile

on:
  push:
    branches: [feat/comunidad-videos-resenas]
    paths: [.github/workflows/regenerar-lockfile.yml]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: alecktourfrondend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerar lockfile
        working-directory: alecktourfrondend
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: alecktourfrondend/pnpm-lock.yaml
