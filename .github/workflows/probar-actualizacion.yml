# TEMPORAL: prueba subir FastAPI (starlette) y fastapi-mail (aiosmtplib) a
# su última versión con toda la batería de pruebas, y dice qué versiones
# quedaron. Se borra después.
name: probar-actualizacion
on:
  push:
    branches: [mejora/**]
    paths: [.github/workflows/probar-actualizacion.yml]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://admin:admin123@localhost:5432/alektours_db
      SECRET_KEY: ci-test-secret-key-solo-para-ci-no-usar-en-produccion-32chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MAIL_USERNAME: test@test.com
      MAIL_PASSWORD: test
      MAIL_FROM: noreply@alectours.com
      MAIL_PORT: 1025
      MAIL_SERVER: localhost
      MAIL_FROM_NAME: AlecTours
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cp .env.example .env
      - run: pip install -r requirements-dev.txt
      - run: pip install -U fastapi fastapi-mail pip-audit
      - run: pip show fastapi starlette fastapi-mail aiosmtplib pydantic uvicorn | grep -E "^(Name|Version|Requires):"
      - run: python -m pytest -q -p no:cacheprovider --no-cov tests --ignore=tests/integration 2>&1 | tail -25
      - run: pip freeze > congelado.txt && pip-audit -r congelado.txt --progress-spinner off || true
