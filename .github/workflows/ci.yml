name: AlecTours Docker CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff + ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        working-directory: backend
        run: pip install ruff==0.16.5

      - name: Ruff check (backend)
        working-directory: backend
        run: ruff check .

      - name: Ruff format --check (backend)
        working-directory: backend
        run: ruff format --check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: alecktourfrondend
        run: pnpm install --frozen-lockfile

      - name: ESLint (frontend)
        working-directory: alecktourfrondend
        run: pnpm run lint

  test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    # Redis real para el job de CI — sin esto, cualquier test que llame a
    # una ruta que invalida caché (delete_pattern/get_cached en
    # app/core/cache.py, ej. pagar_reserva, confirmar_pago,
    # admin_resolver_solicitud) fallaba con "Temporary failure in name
    # resolution" al intentar resolver el host 'redis' de docker-compose,
    # que no existe en el runner. Hallazgo directo de las pruebas de
    # correo de la Fase 2 del plan de mejora, que son las primeras en
    # ejercitar rutas completas (no solo repositorios) en este proyecto.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create CI environment
        run: cp backend/.env.example backend/.env

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://admin:admin123@localhost:5432/alektours_db
          SECRET_KEY: ci-test-secret-key-solo-para-ci-no-usar-en-produccion-32chars
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          MAIL_USERNAME: test@test.com
          MAIL_PASSWORD: test
          MAIL_FROM: noreply@alectours.com
          MAIL_PORT: 1025
          MAIL_SERVER: localhost
          MAIL_FROM_NAME: AlecTours
          REDIS_URL: redis://localhost:6379/0
        # Toda la suite de backend/tests/ (pyproject.toml: testpaths). Antes
        # se corrian copias viejas que estaban sueltas en la raiz de
        # backend/ y nunca se ejecutaban test_mensajes_chat.py ni
        # test_verificacion_email.py.
        run: pytest tests -v

  docker:
    name: Docker Build & Validate
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create CI environment
        run: cp backend/.env.example backend/.env

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build --no-cache
