name: AlecTours Docker CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff + ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        working-directory: backend
        run: pip install ruff==0.16.5

      - name: Ruff check (backend)
        working-directory: backend
        run: ruff check .

      - name: Ruff format --check (backend)
        working-directory: backend
        run: ruff format --check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: alecktourfrondend
        run: pnpm install --no-frozen-lockfile

      - name: ESLint (frontend)
        working-directory: alecktourfrondend
        run: pnpm run lint

  # Los tests de backend (y ahora también los de frontend, con su umbral
  # de cobertura) se movieron a .github/workflows/tests.yml en la semana 2
  # del bootcamp de testing: así cada parte es un check propio que la regla
  # de rama puede exigir. Este workflow queda para lint y build de Docker.

  docker:
    name: Docker Build & Validate
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create CI environment
        run: cp backend/.env.example backend/.env

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build --no-cache
