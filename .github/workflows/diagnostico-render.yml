name: diagnostico-render
on:
  push:
    branches: [chore/diagnostico-render]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node .github/scripts/diagnostico-render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas/
          if-no-files-found: ignore
