services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_DB: alektours_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d alektours_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - alecktours_network

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: always

    ports:
      - "1025:1025"
      - "8025:8025"

    networks:
      - alecktours_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: correoadmin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin1234

    ports:
      - "5050:80"

    depends_on:
      - postgres

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - alecktours_network

  backend:
    build:
      context: ./backend
      target: dev

    container_name: fastapi_backend
    restart: always

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    # backend/.env.example ya trae valores por defecto seguros para
    # desarrollo local (mismas credenciales que el servicio "postgres" de
    # aquí arriba, Mailpit como SMTP, etc.) — así `docker compose up
    # --build` funciona con un solo comando, sin crear ningún .env a mano.
    # backend/.env es opcional (required: false) y, si existe, sus valores
    # tienen prioridad sobre los de .env.example (Compose aplica los
    # archivos de env_file en orden, el último gana) — úsalo para
    # sobreescribir cualquier valor en tu máquina sin tocar archivos
    # versionados.
    env_file:
      - ./backend/.env.example
      - path: ./backend/.env
        required: false

    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_started

    networks:
      - alecktours_network

  frontend:
    build:
      context: ./alecktourfrondend

    container_name: react_frontend
    restart: always

    ports:
      - "5173:5173"

    volumes:
      - ./alecktourfrondend:/app
      - /app/node_modules

    # Destino del proxy de desarrollo de Vite (ver vite.config.ts): dentro
    # de la red de Docker el backend se llama "backend", no localhost.
    environment:
      API_PROXY_TARGET: http://backend:8000

    depends_on:
      - backend

    networks:
      - alecktours_network
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - alecktours_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  alecktours_network:
    driver: bridge
